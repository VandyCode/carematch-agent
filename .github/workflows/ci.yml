name: CareMatch CI, Golden Evaluation & Sanitization Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic fastapi uvicorn httpx python-dotenv pyyaml opentelemetry-api opentelemetry-sdk pytest pytest-asyncio
          pip install -e .

      - name: Run External Sanitization & 95/95 Rubric Unit Tests
        run: |
          pytest tests/unit -v

      - name: Run FastAPI End-to-End Integration Tests
        run: |
          pytest tests/integration -v

      - name: Run Golden Dataset Evaluation Harness (SLA & Accuracy Benchmark)
        run: |
          python tests/eval/eval_harness.py

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-evaluate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Container Image Build
        run: |
          docker build -t carematch-agent:ci .
